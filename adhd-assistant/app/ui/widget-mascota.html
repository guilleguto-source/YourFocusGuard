<!DOCTYPE html>
<html lang="es" data-reaction-state="idle" data-pet-name="einstein">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#171d31">
  <title>Mascota Einstein</title>
  <link rel="stylesheet" href="widget-mascota.css">
</head>
<body class="cuerpo-mascota">
  <div class="layout-horizontal">
    <!-- Zona Mascota (Izquierda / Centro) -->
    <div class="zona-mascota">
      <div id="burbuja" class="burbuja-mascota">
        <div id="burbuja-texto" class="burbuja-texto">¡Todo listo para avanzar con foco!</div>
        <div id="burbuja-opciones" class="burbuja-opciones"></div>
      </div>

      <!-- Barra de Control de Sesión de Trabajo (Edición de Fotos / Vibe Coding) -->
      <div id="contenedor-sesion" class="contenedor-sesion">
        <div id="sesion-inactiva" class="sesion-inactiva">
          <button id="btn-iniciar-trabajo" class="btn-iniciar-trabajo" type="button" title="Iniciar sesión de trabajo">
            <span class="icono-trabajo">🚀</span>
            <span class="txt-trabajo">Iniciar Trabajo</span>
          </button>
          <div id="selector-perfiles" class="selector-perfiles oculta">
            <button id="btn-perfil-fotos" class="btn-perfil btn-fotos" type="button" title="Lightroom, Photoshop">
              📸 Editar Fotos
            </button>
            <button id="btn-perfil-coding" class="btn-perfil btn-coding" type="button" title="VS Code, Windsurf, Cursor, Terminales">
              💻 Vibe Coding
            </button>
          </div>
        </div>

        <div id="sesion-activa" class="sesion-activa oculta">
          <div class="indicador-sesion">
            <span class="punto-foco"></span>
            <span id="tarea-activa-txt" class="tarea-activa-txt">En Foco</span>
          </div>
          <button id="btn-cerrar-sesion" class="btn-cerrar-sesion" type="button" title="Finalizar sesión de trabajo">
            ⏹ Fin
          </button>
        </div>
      </div>

      <div class="pet-shell" id="pet-shell" title="Toca a Einstein para saludar">
        <div class="installed-card">
          <div id="pet-sprite" class="installed-sprite"></div>
        </div>
      </div>
    </div>

    <!-- Columna Lateral Derecha (Botones Verticales) -->
    <div class="columna-botones-mascota">
      <button id="btn-pausa-5m" class="btn-pet btn-pausa" type="button" title="Pausar / Dormitar +5m">
        <span class="btn-pet-icon">⏸</span>
        <span class="btn-pet-txt">+5m</span>
      </button>
      <button id="btn-voz" class="btn-pet btn-mic" type="button" title="Hablar con la mascota">
        <span class="btn-pet-icon">🎤</span>
      </button>
      <button id="btn-seguir-5m" class="btn-pet btn-seguir" type="button" title="Foco +5m">
        <span class="btn-pet-icon">▶</span>
        <span class="btn-pet-txt">+5m</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="widget-mascota.js"></script>
</body>
</html>
