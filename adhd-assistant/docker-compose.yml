version: "3.8"

services:
  adhd-assistant:
    build: .
    container_name: adhd-assistant
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    container_name: adhd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data