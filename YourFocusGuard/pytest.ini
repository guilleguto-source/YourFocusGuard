[pytest]
# Los tests se importan de dos formas: `from tests.test_sesion import ...`
# (necesita la raíz) y `from test_engine import ...` (necesita tests/).
# Con `tests/__init__.py` el modo prepend deja de añadir tests/ solo, así que
# declaramos ambos caminos aquí.
pythonpath = . tests
testpaths = tests
